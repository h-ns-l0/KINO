# 결제 승인 테스트 전용 설정
# - 외부 의존(MySQL, 토스페이먼츠, SMTP)을 타지 않고 승인 흐름만 검증한다.
# - H2는 SELECT ... FOR UPDATE(비관적 락)를 지원하므로 동시 승인 제어를 재현할 수 있다.
spring.datasource.url=jdbc:h2:mem:kino_test;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# 실제 PG 키는 사용하지 않는다 (TossPaymentClient는 테스트에서 스텁으로 대체)
toss.secret-key=test_sk_dummy
